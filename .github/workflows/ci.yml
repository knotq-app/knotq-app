name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-macos:
    name: Check (macOS)
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: macos

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

  check-linux:
    name: Check (Linux)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: linux

      - uses: ./.github/actions/linux-deps

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: |
          cargo test --workspace
          sh bundling/tests/linux-installer-layout.sh

  check-windows:
    name: Check (Windows)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: windows

      - name: Check workspace
        run: cargo check --workspace

      - name: Test workspace
        run: cargo test --workspace

  perf-budget:
    name: Performance budget
    runs-on: ubuntu-24.04
    # Release: the wall-clock ceilings only mean anything optimized, and the
    # shape assertions are ratios so they hold either way. `KNOTQ_PERF_BUDGET`
    # switches the ceilings on; without it only the shape tests run (which is
    # what happens inside `cargo test --workspace` on the other jobs).
    env:
      KNOTQ_PERF_BUDGET: 1

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: perf-budget

      - uses: ./.github/actions/linux-deps

      - name: Enforce performance budgets
        run: cargo test -p knotq-state --test perf_budget --release -- --nocapture

  sync-fuzz:
    name: Deep sync fuzz
    runs-on: ubuntu-24.04
    # Release, not debug: the fuzzer is 7.6x faster optimized (the same
    # 100 seeds x 240 steps takes 200 s debug vs 26 s release, measured), so the
    # same wall time buys 5x the seeds and 1.7x the depth. The convergence bugs
    # fixed in this area needed 1500 x 400 to surface, so depth is the whole
    # point — see the nightly `sync-fuzz.yml` for the full run.
    env:
      KNOTQ_FUZZ_SEEDS: 300
      KNOTQ_FUZZ_STEPS: 400

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: sync-fuzz

      - uses: ./.github/actions/linux-deps

      - name: Run model-based multi-device sync fuzzer
        run: cargo test -p knotq-sync --test sync_property_model --release -- --nocapture

      - name: Run deterministic hard-scenario fuzzer
        run: |
          cargo test -p knotq-sync --test hard_scenarios --release \
            scenario_l_randomized_fuzz_seeds -- --exact --nocapture
