name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  # ── Mandatory pre-release gate ──────────────────────────────────────────────
  # No signed artifact is built until the sync engine has survived the full
  # convergence stress suite (deep in-memory property fuzz + HTTP + WebSocket
  # scenario/fuzz against a real Cloudflare Worker). A sync regression that
  # reverts users' edits or wedges a device must never reach a release.
  # See AGENTS.md / CLAUDE.md — "Deployment gate".
  sync-stress:
    name: Sync stress gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: sync-stress
      - name: Sync stress test (release depth)
        uses: ./.github/actions/sync-stress
        with:
          # A release runs deeper than PR CI — this is the last line of defence.
          fuzz-seeds: "800"
          fuzz-steps: "400"
          ws-fuzz-seeds: "8"
          ws-fuzz-steps: "60"
          ws-hop-seeds: "3"
          ws-hop-steps: "24"
          backend-repo-token: ${{ secrets.BACKEND_REPO_TOKEN }}

  mobile-accounts:
    name: Mobile core accounts
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: knotq-app/mobile
          path: mobile
          token: ${{ secrets.MOBILE_REPO_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: mobile-accounts

      - uses: ./.github/actions/linux-deps

      - name: Test mobile core with accounts
        working-directory: mobile
        run: cargo test -p knotq-mobile-core --features accounts

  build-macos-arch:
    name: macOS build (${{ matrix.artifact }})
    runs-on: ${{ matrix.runner }}
    needs: [sync-stress, mobile-accounts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: macos-arm64
            runner: macos-15
          - target: x86_64-apple-darwin
            artifact: macos-x86_64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: ${{ matrix.target }}

      - name: Install build dependencies
        run: cargo install cargo-bundle --locked

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Apply bundle version
        run: perl -0pi -e 's/^version = "[^"]+"/version = "$ENV{KNOTQ_VERSION}"/m' desktop/app/Cargo.toml
        env:
          KNOTQ_VERSION: ${{ steps.version.outputs.version }}

      - name: Verify Google OAuth credentials
        run: test -n "$KNOTQ_GOOGLE_OAUTH_CLIENT_ID" && test -n "$KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET"
        env:
          KNOTQ_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.KNOTQ_GOOGLE_OAUTH_CLIENT_ID }}
          KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Bundle app
        run: |
          cargo bundle --package knotq-app --release --target ${{ matrix.target }}
          cargo build --package knotq-mcp-bridge --release --target ${{ matrix.target }}
          cp "target/${{ matrix.target }}/release/knotq-mcp" \
            "target/${{ matrix.target }}/release/bundle/osx/KnotQ.app/Contents/MacOS/knotq-mcp"
        env:
          KNOTQ_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.KNOTQ_GOOGLE_OAUTH_CLIENT_ID }}
          KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Upload unsigned app bundle
        run: |
          APP_PATH="target/${{ matrix.target }}/release/bundle/osx/KnotQ.app"
          test -d "$APP_PATH"
          mkdir -p dist/macos-build
          ditto -c -k --keepParent "$APP_PATH" "dist/macos-build/KnotQ-${{ matrix.artifact }}-unsigned.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: KnotQ-build-${{ matrix.artifact }}
          path: dist/macos-build/KnotQ-*-unsigned.zip

  package-macos:
    name: macOS package (${{ matrix.artifact }})
    runs-on: macos-15
    needs: [build-macos-arch]
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: macos-arm64
            arch: arm64
          - artifact: macos-x86_64
            arch: x86_64

    steps:
      - uses: actions/checkout@v6

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download macOS app bundles
        uses: actions/download-artifact@v7
        with:
          name: KnotQ-build-${{ matrix.artifact }}
          path: dist/macos-input

      - name: Unpack app bundles
        run: |
          mkdir -p "dist/macos-input/${{ matrix.arch }}"
          ditto -x -k "dist/macos-input/KnotQ-${{ matrix.artifact }}-unsigned.zip" "dist/macos-input/${{ matrix.arch }}"
          test -d "dist/macos-input/${{ matrix.arch }}/KnotQ.app"

      - name: Import macOS signing certificate
        run: |
          if [[ -z "${MACOS_CERTIFICATE_P12:-}" || -z "${MACOS_CERTIFICATE_PASSWORD:-}" ]]; then
            echo "Skipping certificate import; MACOS_CERTIFICATE_P12 or MACOS_CERTIFICATE_PASSWORD is not set."
            exit 0
          fi

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/knotq-signing.keychain-db"

          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sign, notarize, and package
        run: |
          bash bundling/macos/post-bundle.sh \
            "${KNOTQ_VERSION}" \
            "${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            "${{ matrix.arch }}" \
            "dist/macos-input/${{ matrix.arch }}/KnotQ.app"
        env:
          KNOTQ_VERSION: ${{ steps.version.outputs.version }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          CODESIGN_ENTITLEMENTS: bundling/macos/KnotQ.entitlements
          APPLE_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARY_KEYCHAIN_PROFILE }}
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}

      - name: Verify macOS signature and notarization
        run: |
          APP="target/package-macos/${{ matrix.arch }}/KnotQ.app"
          DMG="dist/macos/KnotQ-${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.dmg"

          test -d "$APP" || { echo "::error::app bundle not found: $APP"; exit 1; }
          test -f "$DMG" || { echo "::error::dmg not found: $DMG"; exit 1; }

          # A missing/misconfigured MACOS_CERTIFICATE_P12 / MACOS_CERTIFICATE_
          # PASSWORD / CODESIGN_IDENTITY secret makes post-bundle.sh silently
          # fall back to an ad-hoc signature with no notarization (it still
          # exits 0) — Gatekeeper blocks that on every user's first launch.
          # Fail the release build here instead of shipping it quietly.
          if ! codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "Authority=Developer ID Application"; then
            echo "::error::$APP is not signed with a Developer ID Application identity (ad-hoc/unsigned fallback — check MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, and CODESIGN_IDENTITY secrets)"
            codesign -dv --verbose=4 "$APP" || true
            exit 1
          fi

          if ! spctl --assess --type execute --verbose "$APP"; then
            echo "::error::$APP failed Gatekeeper assessment"
            exit 1
          fi

          if ! xcrun stapler validate "$DMG"; then
            echo "::error::$DMG is not notarized/stapled (check APPLE_NOTARY_KEYCHAIN_PROFILE or APPLE_NOTARY_APPLE_ID/APPLE_NOTARY_PASSWORD/APPLE_NOTARY_TEAM_ID secrets)"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: KnotQ-release-${{ matrix.artifact }}
          path: dist/macos/KnotQ-*.dmg

  build-windows:
    name: Windows
    runs-on: windows-latest
    needs: [sync-stress, mobile-accounts]
    environment: release-signing
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: windows-x86_64

      - name: Derive version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Apply version
        shell: bash
        run: perl -0pi -e 's/^version = "[^"]+"/version = "$ENV{KNOTQ_VERSION}"/m' desktop/app/Cargo.toml
        env:
          KNOTQ_VERSION: ${{ steps.version.outputs.version }}

      - name: Verify Google OAuth credentials
        shell: bash
        run: test -n "$KNOTQ_GOOGLE_OAUTH_CLIENT_ID" && test -n "$KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET"
        env:
          KNOTQ_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.KNOTQ_GOOGLE_OAUTH_CLIENT_ID }}
          KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Build
        run: cargo build --package knotq-app --package knotq-mcp-bridge --release --target x86_64-pc-windows-msvc
        env:
          KNOTQ_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.KNOTQ_GOOGLE_OAUTH_CLIENT_ID }}
          KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure PowerShell Gallery
        shell: pwsh
        run: |
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
          }
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted

      - name: Sign Windows app binary
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERT_PROFILE }}
          files: |
            ${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\knotq.exe
            ${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\knotq-mcp.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: KnotQ
          description-url: https://github.com/${{ github.repository }}
          cache-dependencies: false

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package Windows installer
        shell: pwsh
        run: ./bundling/windows/package-installer.ps1 "${{ steps.version.outputs.version }}" "x86_64-pc-windows-msvc"

      - name: Sign Windows installers
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\windows
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: KnotQ Windows Installers
          description-url: https://github.com/${{ github.repository }}
          cache-dependencies: false

      - name: Verify Windows signatures
        shell: pwsh
        run: |
          $binary = "${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\knotq.exe"
          $artifacts = @(
            $binary,
            "${{ github.workspace }}\dist\windows\KnotQ-${{ steps.version.outputs.version }}-windows-x64-setup.exe"
          )

          foreach ($file in $artifacts) {
            if (-not (Test-Path $file)) {
              throw "signed artifact not found: $file"
            }

            $signature = Get-AuthenticodeSignature -FilePath $file
            Write-Host "${file}: $($signature.Status)"
            if ($signature.Status -ne "Valid") {
              $signature | Format-List *
              throw "invalid Authenticode signature: $file"
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: KnotQ-release-windows-x64
          path: |
            dist/windows/KnotQ-*-setup.exe

  build-linux:
    name: Linux
    runs-on: ubuntu-24.04
    needs: [sync-stress, mobile-accounts]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        continue-on-error: true
        with:
          key: linux-x86_64

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libfontconfig1-dev \
            libasound2-dev

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Apply version
        run: perl -0pi -e 's/^version = "[^"]+"/version = "$ENV{KNOTQ_VERSION}"/m' desktop/app/Cargo.toml
        env:
          KNOTQ_VERSION: ${{ steps.version.outputs.version }}

      - name: Verify Google OAuth credentials
        run: test -n "$KNOTQ_GOOGLE_OAUTH_CLIENT_ID" && test -n "$KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET"
        env:
          KNOTQ_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.KNOTQ_GOOGLE_OAUTH_CLIENT_ID }}
          KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Build
        run: cargo build --package knotq-app --package knotq-mcp-bridge --release --target x86_64-unknown-linux-gnu
        env:
          KNOTQ_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.KNOTQ_GOOGLE_OAUTH_CLIENT_ID }}
          KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.KNOTQ_GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Package
        run: |
          mkdir -p dist/linux/stage/assets dist/linux
          cp target/x86_64-unknown-linux-gnu/release/knotq dist/linux/stage/knotq
          cp target/x86_64-unknown-linux-gnu/release/knotq-mcp dist/linux/stage/knotq-mcp
          cp -R desktop/app/assets/. dist/linux/stage/assets/
          find dist/linux/stage/assets -name .DS_Store -delete
          chmod +x dist/linux/stage/knotq dist/linux/stage/knotq-mcp
          tar czf "dist/linux/KnotQ-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" \
            -C dist/linux/stage knotq knotq-mcp assets

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: KnotQ-release-linux-x86_64
          path: dist/linux/KnotQ-*.tar.gz

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: [package-macos, build-windows, build-linux]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v7
        with:
          pattern: KnotQ-release-*
          path: dist
          merge-multiple: true

      - name: Add Linux install script
        run: cp bundling/install.sh dist/install.sh

      - name: Generate update manifest
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          manifest="dist/latest.json"

          asset_json() {
            local os="$1"
            local arch="$2"
            local kind="$3"
            local name="$4"
            local comma="$5"
            local path="dist/${name}"

            test -f "$path"
            local sha
            sha="$(sha256sum "$path" | cut -d' ' -f1)"
            printf '    {"os":"%s","arch":"%s","kind":"%s","name":"%s","url":"%s/%s","sha256":"%s"}%s\n' \
              "$os" "$arch" "$kind" "$name" "$base_url" "$name" "$sha" "$comma"
          }

          {
            printf '{\n'
            printf '  "version": "%s",\n' "$version"
            printf '  "notes_url": "https://github.com/%s/releases/tag/%s",\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
            printf '  "assets": [\n'
            asset_json "macos" "aarch64" "dmg" "KnotQ-${version}-macos-arm64.dmg" ","
            asset_json "macos" "x86_64" "dmg" "KnotQ-${version}-macos-x86_64.dmg" ","
            asset_json "linux" "x86_64" "tar.gz" "KnotQ-${version}-linux-x86_64.tar.gz" ","
            asset_json "windows" "x86_64" "inno" "KnotQ-${version}-windows-x64-setup.exe" ""
            printf '  ]\n'
            printf '}\n'
          } > "$manifest"

      - name: Generate checksums
        shell: bash
        run: |
          for file in dist/*; do
            [ -f "$file" ] || continue
            case "$file" in
              *.sha256) continue ;;
            esac
            sha256sum "$file" > "$file.sha256"
          done

      - uses: softprops/action-gh-release@v2
        with:
          name: KnotQ ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/*
