[package]
name = "knotq-storage-json"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
keyring = { workspace = true }
knotq-commands = { workspace = true }
knotq-date-util = { workspace = true }
knotq-history = { workspace = true }
knotq-l10n = { workspace = true }
knotq-model = { workspace = true }
knotq-storage = { workspace = true }
knotq-sync = { workspace = true }
quick-xml = "0.39"
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# `File::sync_all`/`sync_data` are both `fcntl(F_FULLFSYNC)` on Apple platforms,
# so the cheap "push this file to the device" half of a durable write is only
# reachable through `fsync(2)` directly. See `src/durability.rs`.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2"
