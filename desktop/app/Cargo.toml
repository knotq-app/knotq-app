[package]
name = "knotq-app"
version = "0.1.0"
edition = "2021"
description = "A structured task and calendar app."
build = "build.rs"

[[bin]]
name = "knotq"
path = "src/main.rs"

[package.metadata.bundle]
name = "KnotQ"
identifier = "com.enigmadux.knotq"
icon = ["desktop/app/assets/app-icon/*.png", "assets/app-icon/*.png"]
category = "public.app-category.productivity"
short_description = "A structured task and calendar app."

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
base64 = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
ureq = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
async-channel = "2.5.0"
futures = "0.3"
toml_edit = "0.22"
webbrowser = { version = "1.2.4", features = ["hardened"] }
knotq-auto-update = { workspace = true }
knotq-commands = { workspace = true }
knotq-date-util = { workspace = true }
knotq-editor = { workspace = true }
knotq-index = { workspace = true }
knotq-mcp = { workspace = true }
knotq-l10n = { workspace = true, features = ["system-locale"] }
knotq-model = { workspace = true }
knotq-rrule = { workspace = true }
knotq-state = { workspace = true }
knotq-sync = { workspace = true }
knotq-notifications = { workspace = true }
knotq-storage-json = { workspace = true }
knotq-theme = { workspace = true }
knotq-ui = { workspace = true }
# WebSocket sync transport (opt-in while it is brought up). rustls backend matches
# the workspace's existing rustls (via ureq), avoiding a second TLS stack.
tungstenite = { version = "0.23", features = ["rustls-tls-webpki-roots"], optional = true }

# The Apple-sidebar draft installs its own `NSVisualEffectView` so the sidebar
# can use Finder's `sidebar` material. GPUI's own `Blurred` appearance picks a
# colorless `selection` material and strips the backdrop layers, which leaves a
# transparent window rather than a blurred one.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[lints.rust]
# `objc` 0.2's `msg_send!` and `class!` expand to `cfg(feature = "cargo-clippy")`.
# Declaring it expected silences those without blanket-allowing the lint, which
# still catches a real typo in one of this crate's own feature names.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[features]
# `accounts` gates sign-in / network sync / billing / subscription functionality.
# It is enabled in shipped desktop builds. Local CRDT/sync metadata remains
# portable either way, while the account surface adds the persistent WebSocket
# transport (`ws-sync`) and falls back to HTTP polling when the socket is down.
default = ["accounts"]
accounts = ["ws-sync"]
ws-sync = ["dep:tungstenite"]
